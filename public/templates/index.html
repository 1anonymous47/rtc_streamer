<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTC Streamer - Sign In</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #0b0f19;
            --bg-card: rgba(17, 24, 39, 0.85);
            --bg-card-border: rgba(255, 255, 255, 0.08);
            --bg-input: #111827;
            --border-input: rgba(255, 255, 255, 0.12);
            --border-input-focus: #6366f1;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --green: #10b981;
            --red: #ef4444;
            --radius-lg: 16px;
            --radius-md: 10px;
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-body);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.12) 0px, transparent 50%);
            color: var(--text-primary);
            font-family: var(--font-family);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Subtle canvas backdrop */
        #cyberCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.4;
        }

        .scanlines {
            display: none;
        }

        .ambient-glow {
            display: none;
        }

        /* Main Portal Wrapper */
        .portal-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
        }

        /* Modern Card */
        .cyber-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--bg-card-border);
            border-radius: var(--radius-lg);
            padding: 36px 32px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
            position: relative;
        }

        /* Brand Header */
        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-badge {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            margin-bottom: 14px;
            box-shadow: 0 8px 16px rgba(99, 102, 241, 0.3);
        }

        .brand-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            margin-bottom: 6px;
        }

        .brand-subtitle {
            font-size: 0.88rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* Navigation Switcher Tabs */
        .tab-dock {
            display: flex;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--bg-card-border);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 24px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 14px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-family: var(--font-family);
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab-btn.active {
            color: #ffffff;
            background: var(--primary);
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4);
        }

        .tab-btn:not(.active):hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.04);
        }

        /* Form Views */
        .form-view {
            display: none;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .form-view.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* Form Inputs */
        .input-group {
            margin-bottom: 18px;
            position: relative;
        }

        .input-label {
            display: block;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .input-field-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease;
        }

        .input-field {
            width: 100%;
            padding: 12px 42px 12px 42px;
            background: var(--bg-input);
            border: 1px solid var(--border-input);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: var(--font-family);
            font-size: 0.92rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-field:focus {
            border-color: var(--border-input-focus);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18);
            background: #131d31;
        }

        .input-field:focus ~ .input-icon {
            color: var(--primary);
        }

        .input-field::placeholder {
            color: var(--text-muted);
        }

        /* Toggle Password Button */
        .toggle-pw-btn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: color 0.2s ease;
        }

        .toggle-pw-btn:hover {
            color: var(--text-primary);
        }

        /* Password Strength Bar */
        .pw-strength-bar {
            height: 3px;
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            margin-top: 6px;
            border-radius: 2px;
            overflow: hidden;
            display: none;
        }

        .pw-strength-fill {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        /* Primary Button */
        .cyber-btn {
            width: 100%;
            padding: 12px 20px;
            margin-top: 10px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
            border: none;
            border-radius: var(--radius-md);
            color: #ffffff;
            font-family: var(--font-family);
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px var(--primary-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .cyber-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45);
        }

        .cyber-btn:active {
            transform: translateY(0);
        }

        .cyber-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        /* Status Banners */
        .status-msg {
            margin-top: 16px;
            padding: 11px 14px;
            border-radius: var(--radius-md);
            font-size: 0.88rem;
            display: none;
            animation: fadeIn 0.2s ease;
        }

        .status-msg.error {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .status-msg.success {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #86efac;
        }

        /* Card Footer */
        .card-footer {
            margin-top: 22px;
            padding-top: 16px;
            border-top: 1px solid var(--bg-card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .footer-tag {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Loading Spinner */
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        .shake {
            animation: shake 0.35s ease;
        }

        /* Hidden or quiet elements for complete code compatibility */
        .audio-toggle-btn, .hud-corner-tr, .hud-corner-bl {
            display: none !important;
        }

        @media (max-width: 480px) {
            .cyber-card {
                padding: 26px 20px;
            }
            .brand-title {
                font-size: 1.35rem;
            }
        }
    </style>
</head>
<body>

    <!-- Background Canvas -->
    <canvas id="cyberCanvas"></canvas>
    <div class="scanlines"></div>

    <div class="portal-wrapper">
        <div class="cyber-card">
            <div class="hud-corner-tr"></div>
            <div class="hud-corner-bl"></div>

            <!-- Audio SFX Toggle Button (Kept for compatibility, hidden by CSS) -->
            <button class="audio-toggle-btn" id="sfxToggleBtn" onclick="toggleAudioSFX()">
                <span id="sfxLabel">SFX OFF</span>
            </button>

            <!-- Brand Header -->
            <div class="brand-header">
                <div class="logo-badge">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="23 7 16 12 23 17 23 7"></polygon>
                        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                    </svg>
                </div>
                <h1 class="brand-title">RTC Streamer</h1>
                <p class="brand-subtitle">High-performance video & audio streaming</p>
            </div>

            <!-- Mode Switcher Tabs -->
            <div class="tab-dock">
                <button class="tab-btn active" id="tabLogin" onclick="switchMode('login')">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                        <polyline points="10 17 15 12 10 7"></polyline>
                        <line x1="15" y1="12" x2="3" y2="12"></line>
                    </svg>
                    Sign In
                </button>
                <button class="tab-btn" id="tabRegister" onclick="switchMode('register')">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="8.5" cy="7.5" r="4"></circle>
                        <line x1="20" y1="8" x2="20" y2="14"></line>
                        <line x1="23" y1="11" x2="17" y2="11"></line>
                    </svg>
                    Create Account
                </button>
            </div>

            <!-- LOGIN VIEW -->
            <div id="loginView" class="form-view active">
                <form id="loginForm" onsubmit="handleLoginSubmit(event)">
                    <div class="input-group">
                        <label class="input-label" for="loginUsername">Username</label>
                        <div class="input-field-wrapper">
                            <input type="text" id="loginUsername" class="input-field" placeholder="Enter your username" autocomplete="username" required>
                            <span class="input-icon">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                </svg>
                            </span>
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="loginPassword">Password</label>
                        <div class="input-field-wrapper">
                            <input type="password" id="loginPassword" class="input-field" placeholder="Enter your password" autocomplete="current-password" required>
                            <span class="input-icon">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                            </span>
                            <button type="button" class="toggle-pw-btn" onclick="togglePasswordVisibility('loginPassword', this)">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="loginSubmitBtn" class="cyber-btn">
                        <span>Sign In</span>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </button>
                </form>
                <div id="loginStatus" class="status-msg"></div>
            </div>

            <!-- REGISTER VIEW -->
            <div id="registerView" class="form-view">
                <form id="registerForm" onsubmit="handleRegisterSubmit(event)">
                    <div class="input-group">
                        <label class="input-label" for="regEmail">Email Address</label>
                        <div class="input-field-wrapper">
                            <input type="email" id="regEmail" class="input-field" placeholder="name@example.com" autocomplete="email" required>
                            <span class="input-icon">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                    <polyline points="22,6 12,13 2,6"></polyline>
                                </svg>
                            </span>
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="regUsername">Username</label>
                        <div class="input-field-wrapper">
                            <input type="text" id="regUsername" class="input-field" placeholder="Choose a username" autocomplete="username" required>
                            <span class="input-icon">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                </svg>
                            </span>
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="regPassword">Password</label>
                        <div class="input-field-wrapper">
                            <input type="password" id="regPassword" class="input-field" placeholder="At least 6 characters" autocomplete="new-password" oninput="updatePasswordStrength(this.value)" required>
                            <span class="input-icon">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                            </span>
                            <button type="button" class="toggle-pw-btn" onclick="togglePasswordVisibility('regPassword', this)">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                        <div class="pw-strength-bar" id="pwStrengthBar">
                            <div class="pw-strength-fill" id="pwStrengthFill"></div>
                        </div>
                    </div>

                    <button type="submit" id="regSubmitBtn" class="cyber-btn">
                        <span>Create Account</span>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </button>
                </form>
                <div id="registerStatus" class="status-msg"></div>
            </div>

            <!-- Footer -->
            <div class="card-footer">
                <div class="footer-tag">
                    <span style="color:var(--green); font-size:10px;">●</span>
                    <span>Direct WebRTC P2P</span>
                </div>
                <div class="footer-tag">
                    <span>End-to-End Encrypted</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        let audioEnabled = false;

        function toggleAudioSFX() {
            audioEnabled = !audioEnabled;
        }

        // Mode Switcher (Login vs Register)
        function switchMode(mode) {
            const tabLogin = document.getElementById("tabLogin");
            const tabRegister = document.getElementById("tabRegister");
            const loginView = document.getElementById("loginView");
            const registerView = document.getElementById("registerView");
            const loginStatus = document.getElementById("loginStatus");
            const registerStatus = document.getElementById("registerStatus");

            loginStatus.style.display = "none";
            registerStatus.style.display = "none";

            if (mode === 'login') {
                tabLogin.classList.add("active");
                tabRegister.classList.remove("active");
                loginView.classList.add("active");
                registerView.classList.remove("active");
                document.getElementById("loginUsername").focus();
            } else {
                tabRegister.classList.add("active");
                tabLogin.classList.remove("active");
                registerView.classList.add("active");
                loginView.classList.remove("active");
                document.getElementById("regEmail").focus();
            }
        }

        // Password Show/Hide Toggle
        function togglePasswordVisibility(fieldId, btn) {
            const input = document.getElementById(fieldId);
            if (input.type === "password") {
                input.type = "text";
                btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;
            } else {
                input.type = "password";
                btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
            }
        }

        // Live Password Strength Meter
        function updatePasswordStrength(val) {
            const bar = document.getElementById("pwStrengthBar");
            const fill = document.getElementById("pwStrengthFill");
            if (!val) {
                bar.style.display = "none";
                return;
            }
            bar.style.display = "block";
            let score = 0;
            if (val.length >= 6) score++;
            if (val.length >= 10) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;

            if (score <= 1) {
                fill.style.width = "25%";
                fill.style.backgroundColor = "var(--red)";
            } else if (score === 2) {
                fill.style.width = "50%";
                fill.style.backgroundColor = "#f59e0b";
            } else if (score === 3) {
                fill.style.width = "75%";
                fill.style.backgroundColor = "var(--primary)";
            } else {
                fill.style.width = "100%";
                fill.style.backgroundColor = "var(--green)";
            }
        }

        // LOGIN SUBMISSION HANDLER
        async function handleLoginSubmit(event) {
            event.preventDefault();
            const usernameInput = document.getElementById("loginUsername");
            const passwordInput = document.getElementById("loginPassword");
            const statusEl = document.getElementById("loginStatus");
            const submitBtn = document.getElementById("loginSubmitBtn");

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            // Client-side Validation
            if (!username) {
                showError(statusEl, "Please enter your username");
                usernameInput.focus();
                triggerShake(usernameInput);
                return;
            }
            if (!password) {
                showError(statusEl, "Please enter your password");
                passwordInput.focus();
                triggerShake(passwordInput);
                return;
            }

            // Set loading state
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span class="spinner"></span><span>Signing in...</span>`;
            statusEl.style.display = "none";

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();

                if (result.code === "0" && result.data) {
                    localStorage.setItem("userId", result.data.id);
                    localStorage.setItem("username", result.data.username);

                    showSuccess(statusEl, `Welcome back, ${result.data.username}! Redirecting...`);
                    submitBtn.innerHTML = `<span>Signed In ✓</span>`;

                    setTimeout(() => {
                        window.location.href = "/dashboard";
                    }, 600);
                } else {
                    showError(statusEl, result.data || "Invalid username or password");
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `<span>Sign In</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>`;
                    triggerShake(document.querySelector(".cyber-card"));
                }
            } catch (err) {
                console.error("Login failure:", err);
                showError(statusEl, "Unable to connect to the server. Please try again.");
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Sign In</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>`;
            }
        }

        // REGISTRATION SUBMISSION HANDLER
        async function handleRegisterSubmit(event) {
            event.preventDefault();
            const emailInput = document.getElementById("regEmail");
            const usernameInput = document.getElementById("regUsername");
            const passwordInput = document.getElementById("regPassword");
            const statusEl = document.getElementById("registerStatus");
            const submitBtn = document.getElementById("regSubmitBtn");

            const email = emailInput.value.trim();
            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            // Client-side Validation
            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showError(statusEl, "Please enter a valid email address");
                emailInput.focus();
                triggerShake(emailInput);
                return;
            }
            if (!username || username.length < 3) {
                showError(statusEl, "Username must contain at least 3 characters");
                usernameInput.focus();
                triggerShake(usernameInput);
                return;
            }
            if (!password || password.length < 4) {
                showError(statusEl, "Password must contain at least 4 characters");
                passwordInput.focus();
                triggerShake(passwordInput);
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span class="spinner"></span><span>Creating account...</span>`;
            statusEl.style.display = "none";

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, username, password })
                });

                const result = await response.json();

                if (result.code === "0") {
                    showSuccess(statusEl, "Account created successfully! You can now sign in.");
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `<span>Account Created ✓</span>`;

                    // Pre-fill login credentials and switch
                    document.getElementById("loginUsername").value = username;
                    document.getElementById("loginPassword").value = password;

                    setTimeout(() => {
                        switchMode('login');
                    }, 1200);
                } else {
                    showError(statusEl, result.data || "Registration failed. Username or email may already be taken.");
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `<span>Create Account</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>`;
                    triggerShake(document.querySelector(".cyber-card"));
                }
            } catch (err) {
                console.error("Register failure:", err);
                showError(statusEl, "Server error. Please try again later.");
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Create Account</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>`;
            }
        }

        function showError(el, msg) {
            el.className = "status-msg error";
            el.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg><span>${msg}</span>`;
            el.style.display = "flex";
        }

        function showSuccess(el, msg) {
            el.className = "status-msg success";
            el.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg><span>${msg}</span>`;
            el.style.display = "flex";
        }

        function triggerShake(element) {
            element.classList.remove("shake");
            void element.offsetWidth; // trigger reflow
            element.classList.add("shake");
            setTimeout(() => element.classList.remove("shake"), 350);
        }

        // Subtle background particles
        (function initCanvas() {
            const canvas = document.getElementById("cyberCanvas");
            if (!canvas) return;
            const ctx = canvas.getContext("2d");
            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;

            window.addEventListener("resize", () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            });

            const particles = [];
            const particleCount = 28;

            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.3,
                    size: Math.random() * 2 + 1,
                    alpha: Math.random() * 0.3 + 0.1
                });
            }

            function draw() {
                ctx.clearRect(0, 0, width, height);

                for (let i = 0; i < particles.length; i++) {
                    const p1 = particles[i];
                    p1.x += p1.vx;
                    p1.y += p1.vy;

                    if (p1.x < 0) p1.x = width;
                    if (p1.x > width) p1.x = 0;
                    if (p1.y < 0) p1.y = height;
                    if (p1.y > height) p1.y = 0;

                    ctx.fillStyle = `rgba(99, 102, 241, ${p1.alpha})`;
                    ctx.beginPath();
                    ctx.arc(p1.x, p1.y, p1.size, 0, Math.PI * 2);
                    ctx.fill();

                    for (let j = i + 1; j < particles.length; j++) {
                        const p2 = particles[j];
                        const dx = p1.x - p2.x;
                        const dy = p1.y - p2.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 100) {
                            ctx.strokeStyle = `rgba(99, 102, 241, ${0.08 * (1 - dist / 100)})`;
                            ctx.beginPath();
                            ctx.moveTo(p1.x, p1.y);
                            ctx.lineTo(p2.x, p2.y);
                            ctx.stroke();
                        }
                    }
                }

                requestAnimationFrame(draw);
            }
            draw();
        })();
    </script>
</body>
</html>
