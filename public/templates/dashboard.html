<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/dashboard.css">
    
    <!-- Toastify CSS -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Toastify JS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
</head>
<body>
    <div class="topbar">
        <div class="logo-area">
            <span class="pulse-icon"></span>
            <p id="userdetails1">Loading user...</p>
        </div>
        <div class="nav-buttons">
            <button class="nav-btn" onclick="showPage('dashboard')">Home</button>
            <button class="nav-btn" onclick="showPage('friends')">Requests</button>
            <button class="nav-btn" onclick="showPage('videochat')">Video Chat</button>
            <button class="nav-btn" onclick="showPage('textchat')">Text Chat</button>
            <button class="nav-btn logout-btn" onclick="logout()">Log Out</button>
        </div>
    </div>

    <div class="content">
        <div id="dashboard" class="page active">
            <div class="welcome-card">
                <h1>Welcome Back!</h1>
                <div class="user-badge">
                    <span class="status-dot"></span>
                    <p id="userdetails2">Loading user...</p>
                </div>
                <p class="subtext">Select a tab from the menu to start messaging or searching for friends.</p>
            </div>
        </div>

        <div id="friends" class="page">
            <div class="video-layout">
                <div class="sidebar-users">
                    <div class="user-card" id="listfriends" onclick="openconnectionpage(`friendslistpage`)">
                        <h2>Friends</h2>
                    </div>
                    <div class="user-card" id="searchFriends" onclick="openconnectionpage(`searchpage`)">
                        <h2>Find Friends</h2>
                    </div>
                    <div class="user-card" id="receivedRequest" onclick="openconnectionpage(`requestspage`)">
                        <h2>Requests</h2>
                    </div>
                    <div class="user-card" id="blockedFriends" onclick="openconnectionpage(`blockedfriends`)">
                        <h2>Blocked</h2>
                    </div>
                </div>
                <div id="connectionpage" class="chatArea"></div>
            </div>
        </div>

        <div id="videochat" class="page">
            <div class="video-layout">
                <div class="sidebar-users">
                    <h3>Online Friends</h3>
                    <div id="userslistvideo"></div>
                </div>
                <div id="chatArea" class="chatArea">
                    <div class="empty-chat-state">
                        <p>Select a friend from the sidebar to start a call</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="textchat" class="page">
            <div class="video-layout">
                <div class="sidebar-users">
                    <h3>Online Friends</h3>
                    <div id="userslisttext"></div>
                </div>
                <div id="chatAreatext" class="chatAreatext">
                    <div class="empty-chat-state">
                        <p>Select a friend from the sidebar to start a message</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <p id="callername" style="display:none;"></p>

    <script src="js/dashboard.js"></script>
</body>
</html>
